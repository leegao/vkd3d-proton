name: Build on Windows

on: [push, pull_request, workflow_dispatch]

jobs:
  build-set-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup widl and glslangValidator
      shell: pwsh
      run: |
        choco install strawberryperl curl -y
        curl "https://raw.githubusercontent.com/HansKristian-Work/vkd3d-proton-ci/main/glslangValidator.exe" -o "C:\Strawberry\c\bin\glslangValidator.exe"
        Write-Output "C:\Strawberry\c\bin" | Out-File -FilePath "${Env:GITHUB_PATH}" -Append

    - name: Setup Meson
      shell: pwsh
      run: pip install meson ninja

    - name: Find Visual Studio
      shell: pwsh
      run: |
        $installationPath = Get-VSSetupInstance `
          | Select-VSSetupInstance -Require Microsoft.VisualStudio.Workload.NativeDesktop -Latest `
          | Select-Object -ExpandProperty InstallationPath
        Write-Output "VSDEVCMD=${installationPath}\Common7\Tools\VsDevCmd.bat" `
          | Out-File -FilePath "${Env:GITHUB_ENV}" -Append

    - name: Build MSVC x86
      shell: pwsh
      run: |
        & "${Env:COMSPEC}" /s /c "`"${Env:VSDEVCMD}`" -arch=x86 -host_arch=x64 -no_logo && set" `
          | % { , ($_ -Split '=', 2) } `
          | % { [System.Environment]::SetEnvironmentVariable($_[0], $_[1]) }
        meson setup -Denable_tests=True -Denable_extras=True --buildtype debugoptimized --backend vs2022 build-msvc-x86
        msbuild -m build-msvc-x86/vkd3d-proton.sln

    - name: Build MSVC x64
      shell: pwsh
      run: |
        & "${Env:COMSPEC}" /s /c "`"${Env:VSDEVCMD}`" -arch=x64 -host_arch=x64 -no_logo && set" `
          | % { , ($_ -Split '=', 2) } `
          | % { [System.Environment]::SetEnvironmentVariable($_[0], $_[1]) }
        meson setup -Denable_tests=True -Denable_extras=True --buildtype debugoptimized --backend vs2022 build-msvc-x64
        msbuild -m build-msvc-x64/vkd3d-proton.sln

    - name: Build MSVC ARM64EC
      shell: pwsh
      run: |
        & "${Env:COMSPEC}" /s /c "`"${Env:VSDEVCMD}`" -arch=arm64 -host_arch=x64 -no_logo && set" `
            | % {
                $parts = $_ -Split '=', 2
                if ($parts[0]) {
                    [System.Environment]::SetEnvironmentVariable($parts[0], $parts[1])
                }
            }

        $wrapperPath = "$pwd\lib_wrapper.ps1"
        $wrapperContent = @'
        $inputs = @()
        $outFile = $null

        foreach ($arg in $args) {
            if ($arg -eq "csr" -or $arg -eq "-csr") { continue }

            if ($arg -eq "/MACHINE:ARM64" -or $arg -eq "-MACHINE:ARM64") { continue }

            if ($arg.EndsWith(".a") -and -not $outFile) {
                $outFile = $arg
            } else {
                $inputs += $arg
            }
        }

        $finalArgs = @("/NOLOGO", "/MACHINE:ARM64EC")
        if ($outFile) { $finalArgs += "/OUT:$outFile" }
        $finalArgs += $inputs

        & lib.exe $finalArgs
        exit $LASTEXITCODE
        '@
        Set-Content -Path $wrapperPath -Value $wrapperContent -Encoding utf8

        $escapedWrapperPath = $wrapperPath.Replace('\', '\\')

        $crossFile = @"
        [binaries]
        c = 'cl'
        cpp = 'cl'
        ar = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '$escapedWrapperPath']

        [built-in options]
        c_args = ['/arm64EC']
        cpp_args = ['/arm64EC']
        c_link_args = ['/MACHINE:ARM64EC']
        cpp_link_args = ['/MACHINE:ARM64EC']

        [properties]
        needs_exe_wrapper = true

        [host_machine]
        system = 'windows'
        cpu_family = 'arm64ec'
        cpu = 'arm64ec'
        endian = 'little'
        "@
        [System.IO.File]::WriteAllText("build-arm64ec.txt", $crossFile)

        if (Test-Path build-msvc-arm64ec) { Remove-Item -Recurse -Force build-msvc-arm64ec }
        meson setup -Denable_tests=False -Denable_extras=True --buildtype debugoptimized --cross-file build-arm64ec.txt build-msvc-arm64ec
        meson compile -C build-msvc-arm64ec

    - name: Upload x86 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vkd3d-proton-x86
        path: |
          build-msvc-x86/**/*.dll

    - name: Upload x64 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vkd3d-proton-x64
        path: |
          build-msvc-x64/**/*.dll

    - name: Upload ARM64EC Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vkd3d-proton-arm64ec
        path: |
          build-msvc-arm64ec/**/*.dll
